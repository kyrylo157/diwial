<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Соцсети — diwial</title><meta name="description" content="Все соцсети diwial: Telegram, Instagram, TikTok, Twitch и ВКонтакте."><meta name="theme-color" content="#070614"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070614'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' text-anchor='middle' fill='%237aa8ff'%3Ed%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tilt+Neon&family=Unbounded:wght@300;500;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="sub.css"><style>.hero-img{max-width:760px;margin:0 auto clamp(36px,6vw,60px);border-radius:26px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/8;box-shadow:0 30px 80px -30px rgba(77,141,255,.55),0 0 0 1px rgba(162,91,255,.15)}.hero-img img{width:100%;height:100%;object-fit:cover}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;max-width:980px;margin:0 auto}.s{position:relative;display:flex;align-items:center;gap:18px;padding:22px 22px;border-radius:22px;border:1px solid var(--line);overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01));transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .4s,box-shadow .4s}.s::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 140px at 0 50%,color-mix(in srgb,var(--cc) 22%,transparent),transparent 70%);opacity:.6;transition:opacity .4s}.s:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--cc) 65%,transparent);box-shadow:0 18px 50px -18px var(--cc)}.s:hover::before{opacity:1}.s .ico{position:relative;flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 14%,transparent);border:1px solid color-mix(in srgb,var(--cc) 45%,transparent);box-shadow:0 0 20px -6px var(--cc)}.s svg{width:28px;height:28px;fill:none;stroke:var(--cc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.s .txt{position:relative;flex:1;min-width:0}.s b{display:block;font-family:var(--head);font-weight:500;font-size:1.05rem}.s .h{display:block;color:var(--ink);opacity:.85;font-size:.92rem;overflow-wrap:anywhere}.s small{display:block;color:var(--muted);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase}.s .arr{position:relative;font-size:1.3rem;color:var(--cc);transition:transform .3s}.s:hover .arr{transform:translate(3px,-3px)}.dm{max-width:620px;margin:clamp(40px,7vw,70px) auto 0;text-align:center;color:var(--muted);font-size:.95rem}.dm b{color:var(--ink);font-weight:500}</style></head><body><header class="top"><a class="brand" href="./"><img src="img/avatar.webp" alt=""><b>diwial</b></a> <a class="back" href="./#info">← на главную</a></header><main class="wrap"><section class="head reveal" style="--c:var(--blue)"><p class="eyebrow">я онлайн</p><h1>Где меня <em>найти</em></h1><p>Тренировки, питание, бокс, стримы и жизнь без фильтров. Выбирай площадку — кнопка перекинет сразу туда.</p></section><div class="hero-img reveal"><img src="img/social.webp" alt="Смартфон на штативе в зале, вокруг уведомления и лайки"></div><div class="list" id="list"></div><p class="dm reveal"><b>Тренировки, реклама, вопросы</b> — пиши в личку в любой из соцсетей, отвечу лично.</p></main><footer><b>diwial</b>© <span id="y"></span></footer><script src="socials.js"></script><script>document.getElementById("list").innerHTML=[...SOCIALS,ABOUT].map(e=>`<a class="s reveal" style="--cc:${e.color}" href="${e.url}"${e.internal?"":' target="_blank" rel="noopener"'}>\n     <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${e.icon}</svg></span>\n     <span class="txt"><b>${e.name}</b><span class="h">${e.handle}</span><small>${e.note}</small></span>\n     <span class="arr">${e.internal?"→":"↗"}</span></a>`).join(""),document.getElementById("y").textContent=(new Date).getFullYear();const io=new IntersectionObserver(e=>e.forEach((e,n)=>{e.isIntersecting&&(e.target.style.transitionDelay=70*n+"ms",e.target.classList.add("in"),io.unobserve(e.target))}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>io.observe(e))</script></body></html>
